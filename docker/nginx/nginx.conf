user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time req_id=$req_id';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Global upload limit (a little above the API's 25 MB limit to let the API return 413 FILE_TOO_LARGE)
    client_max_body_size 30m;

    # Gzip compression for static files (text, CSS, JS, JSON, XML, SVG)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Upstream backend service (FastAPI running in the 'api' container)
    upstream api_backend {
        server api:8000;
    }

    # Request ID resolution: preserve client's X-Request-ID if provided, else generate one via $request_id
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # ---------------------------------------------------------------------------------------------
    # ROUTE COLLISION RESOLUTION RULE (/documents, /chat, /sessions):
    #
    # The React Router single-page application (SPA) defines client-side routes at /documents,
    # /chat, /chat/:sessionId, and /sessions. At the same time, FastAPI exposes REST/SSE endpoints
    # sharing those exact path prefixes (/documents, /chat, /chat/stream, /sessions, etc.).
    #
    # To cleanly differentiate between a browser page navigation and an application API call:
    # 1. Sec-Fetch-Dest header:
    #    - All modern browsers (Chrome, Edge, Firefox, Safari) send "Sec-Fetch-Dest: document"
    #      when loading a top-level page or following a navigation link.
    #    - In contrast, client-side fetch() and XMLHttpRequest send "Sec-Fetch-Dest: empty".
    # 2. Accept header:
    #    - Browsers navigating to a page include "text/html" in their Accept header.
    #    - API calls (fetch/XHR) send "Accept: application/json" or "*/*" (never prioritizing text/html).
    # 3. HTTP Request Method:
    #    - Only GET and HEAD requests can represent browser page loads. State-mutating requests
    #      (POST, PUT, DELETE, PATCH, etc., such as POST /chat or DELETE /documents/:id) are ALWAYS
    #      API requests and must never be routed to index.html.
    #
    # Decision matrix:
    # - If (Sec-Fetch-Dest == 'document' OR Accept contains 'text/html') AND Method in (GET, HEAD):
    #   $serve_spa_index = 1 -> Rewrite URI internally to /index.html and serve the SPA.
    # - Otherwise:
    #   $serve_spa_index = 0 -> Forward the request unchanged to the api_backend upstream.
    # ---------------------------------------------------------------------------------------------

    map $http_sec_fetch_dest $dest_is_document {
        default 0;
        "document" 1;
    }

    map $http_accept $accept_is_html {
        default 0;
        "~*text/html" 1;
    }

    map "$dest_is_document:$accept_is_html" $is_browser_nav {
        "~1" 1;
        default 0;
    }

    map "$request_method:$is_browser_nav" $serve_spa_index {
        "GET:1" 1;
        "HEAD:1" 1;
        default 0;
    }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Forwarded headers configuration
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx is the only proxy, so a client-supplied header must not be trusted
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;

        # Block the internal metrics endpoint from external access (return 404 Not Found)
        location = /metrics {
            return 404;
        }

        # Dedicated Server-Sent Events (SSE) route for /chat/stream:
        # - proxy_buffering off: delivers events progressively to the client as they arrive
        # - proxy_http_version 1.1 & Connection "": enables persistent connection
        # - proxy_read_timeout 600s: allows long model execution (SSE heartbeat every ~15s keeps socket alive)
        # - add_header X-Accel-Buffering no: instructs any upstream/downstream intermediate proxies not to buffer
        # - gzip off: compression must be disabled on the SSE stream to prevent buffering chunks
        location ^~ /chat/stream {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # nginx is the only proxy, so a client-supplied header must not be trusted
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            add_header X-Accel-Buffering no;
            gzip off;
        }

        # Colliding routes: /documents, /chat, /sessions (and subpaths)
        # Evaluates the header map rule: browser navigations receive index.html; API calls proxy to backend
        location ~ ^/(documents|chat|sessions)(/.*)?$ {
            if ($serve_spa_index = 1) {
                rewrite ^ /index.html last;
            }

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # nginx is the only proxy, so a client-supplied header must not be trusted
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
        }

        # Non-colliding backend API routes: /auth, /feedback, /health, /openapi.json, /docs, /redoc
        location ~ ^/(auth|feedback|health|openapi\.json|docs|redoc)(/.*)?$ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # nginx is the only proxy, so a client-supplied header must not be trusted
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
        }

        # Frontend static files and SPA fallback for non-colliding client routes (e.g. /, /login)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
